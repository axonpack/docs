name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded deploy is just stale, so cancelling one is free.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub Pages serves a project site under `/<repo>`, and this repo is named `docs`. Drop both of
  # these and add `public/CNAME` the day the site gets a domain of its own.
  NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
  NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: bun run lint && bun run check-types

      # `output: 'export'` writes a plain directory of files to out/. Nothing here needs a Node
      # server at runtime, which is the whole reason Pages can host it.
      - name: Build static export
        run: bun run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    # A pull request builds to prove it still compiles, and stops there — only main is published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
